name: Update prices

on:
  schedule:
    - cron: '17 14 * * *'   # daily, about 7:17am Pacific
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/update-prices.mjs'
      - '.github/workflows/update-prices.yml'
      - 'config.js'

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check prices
        run: node scripts/update-prices.mjs
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
      - name: Save prices.json
        run: |
          if git diff --quiet -- prices.json && git ls-files --error-unmatch prices.json >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Update prices"
          git pull --rebase origin main
          git push
